<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List — empty | MySimpleTodo</title>
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    /* Page-specific layout for List screen — empty state */
    .list-toolbar {
      display: flex;
      align-items: center;
      gap: calc(var(--base-unit) * 2);
      margin-bottom: calc(var(--base-unit) * 4);
    }
    .list-toolbar .input {
      max-width: 28rem;
      flex: 1;
    }
    .list-toolbar select.input {
      max-width: 12rem;
      flex: none;
    }
    .empty-state-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 24rem;
      text-align: center;
    }
    .empty-state-wrapper .empty-icon {
      width: 4rem;
      height: 4rem;
      color: var(--text-muted);
      opacity: 0.35;
      margin-bottom: var(--base-unit);
    }
    .empty-state-wrapper h2 {
      font-size: var(--font-size-h2);
      font-weight: var(--font-weight-h2);
      color: var(--text-primary);
      margin-bottom: calc(var(--base-unit) * 2);
    }
    .empty-state-wrapper p {
      font-size: var(--font-size-body);
      color: var(--text-muted);
      margin-bottom: calc(var(--base-unit) * 4);
      max-width: 24rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">MySimpleTodo</div>
      <nav class="sidebar-nav">
        <a class="nav-item active" href="#">
          <i data-lucide="list-checks" style="width:16px;height:16px;"></i>
          All Tasks
        </a>
        <a class="nav-item" href="#">
          <i data-lucide="plus-circle" style="width:16px;height:16px;"></i>
          Add Task
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <div class="main-content">

      <!-- Top bar -->
      <header class="topbar">
        <span style="font-weight: var(--font-weight-h2); font-size: var(--font-size-h3);">Task Management</span>
        <div style="display:flex;align-items:center;gap:calc(var(--base-unit)*2);">
          <div style="width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--font-size-small);font-weight:600;">U</div>
        </div>
      </header>

      <!-- Content area -->
      <div class="content-area">

        <!-- Page header -->
        <div class="page-header">
          <h1 class="page-title">All Tasks</h1>
          <div class="page-actions">
            <button class="btn btn-primary">
              <i data-lucide="plus" style="width:14px;height:14px;"></i>
              Add Task
            </button>
          </div>
        </div>

        <!-- Toolbar: search + filter (disabled/placeholder in empty state) -->
        <div class="list-toolbar">
          <input class="input" type="text" placeholder="Search tasks..." value="" disabled>
          <select class="input" disabled>
            <option>All statuses</option>
          </select>
          <select class="input" disabled>
            <option>Due Soon</option>
          </select>
        </div>

        <!-- Empty state -->
        <div class="card">
          <div class="empty-state-wrapper">
            <i data-lucide="clipboard-list" class="empty-icon" style="width:64px;height:64px;"></i>
            <h2>No tasks yet</h2>
            <p>You haven't created any tasks yet. Click the button below to add your first task and start staying organized.</p>
            <button class="btn btn-primary">
              <i data-lucide="plus" style="width:14px;height:14px;"></i>
              Add Task
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
