<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>list — loading | Mill Smart Log</title>
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <style>
    /* Page-specific layout only — no colour/radius/shadow literals, CSS variables only */
    body {
      background: var(--color-surface);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
    }
    .preview-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--space-md); }
    .preview-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .mobile-shell { min-height: 780px; box-shadow: var(--shadow-dropdown); }

    .mobile-header-title { display: flex; align-items: center; gap: var(--space-sm); flex: 1; min-width: 0; }
    .mobile-header-title h1 {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-lg);
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: var(--space-touch-target-min); height: var(--space-touch-target-min);
      flex-shrink: 0; color: var(--color-text-primary); cursor: pointer;
    }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .section-label {
      font-size: var(--font-size-xs);
      font-weight: 700;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: var(--space-sm);
    }

    .station-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    /* Loading-state skeleton tile: same footprint as .station-tile so layout does not shift */
    .station-tile-skeleton {
      height: 84px;
      border-radius: var(--radius-card);
    }
  </style>
</head>
<body>
  <div class="preview-wrap">
    <div class="preview-label">List &mdash; loading state (station selector) &middot; Mobile (Operator/Supervisor)</div>

    <div class="mobile-shell">
      <!-- Header: back + title (static chrome renders immediately, only body content loads) -->
      <div class="mobile-header">
        <span class="icon-btn" title="Kembali">
          <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </span>
        <div class="mobile-header-title">
          <h1>Pilih Stasiun</h1>
        </div>
        <span class="icon-btn" title="Menu">
          <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </span>
      </div>
      <div class="mobile-breadcrumb">Production Process Activity</div>

      <!-- Body: skeleton grid while station list loads -->
      <div class="mobile-content">

        <div class="skeleton skeleton-title" style="width: 55%;"></div>
        <div class="station-grid">
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
        </div>

        <div class="skeleton skeleton-title" style="width: 65%;"></div>
        <div class="station-grid">
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
          <div class="skeleton station-tile-skeleton"></div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
