<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Mobile | Mill Smart Log</title>
  <link rel="stylesheet" href="../../../1-foundation/uiux-spec/assets/design-tokens.css">
  <link rel="stylesheet" href="../../../1-foundation/uiux-spec/assets/components.css">
  <link rel="stylesheet" href="../../../1-foundation/uiux-spec/assets/shell.css">
  <style>
    /* page-specific layout only — no colour values, no radius/shadow, use CSS variables only */
    body {
      background: var(--color-surface, #F7F7F7);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .mobile-frame {
      width: 100%;
      max-width: 400px;
      min-height: 100vh;
      background: var(--color-background, #FFFFFF);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card, 0 1px 2px rgba(0,0,0,0.06));
    }

    .auth-mobile-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-2xl, 2.5rem) var(--space-lg, 1.5rem);
      gap: var(--space-xl, 2rem);
    }

    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm, 0.5rem);
    }

    .auth-brand-logo {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-card, 12px);
      background: var(--color-brand, #249360);
      color: var(--color-background, #FFFFFF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: var(--font-size-h2, 22px);
    }

    .auth-brand-name {
      font-size: var(--font-size-h2, 22px);
      font-weight: 600;
      color: var(--color-text-primary, #1F2937);
    }

    .auth-brand-tagline {
      font-size: var(--font-size-small, 14px);
      color: var(--color-text-muted, #6B7280);
      text-align: center;
    }

    .auth-forgot-link {
      display: block;
      text-align: right;
      font-size: var(--font-size-small, 14px);
      color: var(--color-brand, #249360);
      text-decoration: none;
      margin-top: calc(-1 * var(--space-xs, 0.25rem));
    }

    .auth-footnote {
      font-size: var(--font-size-caption, 12px);
      color: var(--color-text-muted, #6B7280);
      font-style: italic;
      margin-top: var(--space-lg, 1.5rem);
      padding: 0 var(--space-lg, 1.5rem) var(--space-lg, 1.5rem);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div class="auth-mobile-body">
      <div class="auth-brand">
        <div class="auth-brand-logo">MS</div>
        <div class="auth-brand-name">Mills System</div>
        <div class="auth-brand-tagline">Mill Smart Log — Digitalisasi Log Sheet Stasiun Produksi</div>
      </div>

      <div class="card">
        <div class="card-header">Login</div>
        <div class="card-body">
          <div class="form">
            <div class="input-group">
              <label for="username">Username / NIK</label>
              <input type="text" id="username" name="username" placeholder="Masukkan username atau NIK">
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Minimal 6 karakter">
            </div>

            <div class="input-group">
              <label for="business_area">Business Area / Company</label>
              <select id="business_area" name="business_area">
                <option value="">Pilih Business Area</option>
                <option value="pks-sei-rumbai">PKS Sei Rumbai</option>
                <option value="pks-kotabaru">PKS Kotabaru</option>
                <option value="pks-tanjung-redeb">PKS Tanjung Redeb</option>
              </select>
            </div>

            <a href="#" class="auth-forgot-link">Lupa Password?</a>

            <div class="form-actions">
              <button type="submit" class="btn-primary">Masuk</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="auth-footnote">
      Actors: Station Operator, Supervisor &nbsp;·&nbsp;
      Entry points: Membuka aplikasi mobile untuk pertama kali (belum login), Redirect setelah logout, Redirect setelah sesi/token lokal kadaluarsa
    </p>
  </div>
</body>
</html>
