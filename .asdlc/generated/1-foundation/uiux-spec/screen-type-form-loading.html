<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>form — loading | Mills Smart Log</title>
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <style>
    /* page-specific layout only — no colour values, no radius/shadow, CSS variables only */
    .form-card { max-width: 920px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-md); }
    .skel-field { display: flex; flex-direction: column; gap: var(--space-xs); }
    .skel-label { width: 40%; }
    .skel-input { height: var(--space-touch_target_min); }
    @media (max-width: 1024px) {
      .form-row, .form-grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>&#9881;</span>
        <span class="label">Mills Smart Log</span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="#">
          <span>&#9635;</span>
          <span class="label">Dashboard</span>
        </a>
        <a class="nav-item active" href="#">
          <span>&#9776;</span>
          <span class="label">Data Stasiun</span>
        </a>
        <a class="nav-item" href="#">
          <span>&#9881;</span>
          <span class="label">Pengaturan Akun</span>
        </a>
      </nav>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-title">Weighbridge — Edit Data</div>
        <div class="topbar-end">
          <span class="badge badge-neutral">Supervisor</span>
          <span style="width:32px;height:32px;border-radius:999px;background:var(--color-brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--font-size-xs);">SP</span>
        </div>
      </header>

      <main class="content-area">
        <div class="breadcrumb">
          <span>Data Stasiun</span>
          <span class="sep">/</span>
          <span>Weighbridge</span>
          <span class="sep">/</span>
          <span class="current">WB-00128</span>
        </div>

        <div class="page-header">
          <div>
            <div class="page-title">Memuat data WB-00128...</div>
          </div>
          <div class="page-actions">
            <button class="btn btn-outline" disabled>&larr; Back</button>
          </div>
        </div>

        <div class="card form-card">
          <div class="card-body">
            <div class="draft-flag">
              <div class="skeleton skeleton-text" style="width: 220px;"></div>
            </div>

            <div class="form">
              <div class="form-row">
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
              </div>

              <div class="form-row">
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
              </div>

              <div class="form-row">
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
              </div>

              <div class="skeleton skeleton-title" style="width: 30%; margin-top: var(--space-md);"></div>

              <div class="detail-row">
                <div class="detail-row-info" style="flex:1;">
                  <div class="skeleton skeleton-text" style="width: 55%;"></div>
                  <div class="skeleton skeleton-text" style="width: 35%;"></div>
                </div>
                <div class="skeleton skeleton-text" style="width: 56px; height: 28px;"></div>
              </div>
              <div class="detail-row">
                <div class="detail-row-info" style="flex:1;">
                  <div class="skeleton skeleton-text" style="width: 50%;"></div>
                  <div class="skeleton skeleton-text" style="width: 40%;"></div>
                </div>
                <div class="skeleton skeleton-text" style="width: 56px; height: 28px;"></div>
              </div>

              <div class="form-grid-3">
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
              </div>

              <div class="skeleton skeleton-title" style="width: 25%; margin-top: var(--space-md);"></div>

              <div class="form-row">
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
                <div class="skel-field">
                  <div class="skeleton skeleton-text skel-label"></div>
                  <div class="skeleton skel-input"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button type="button" class="btn btn-destructive" disabled>Delete</button>
            <button type="button" class="btn btn-warning" disabled>Pause</button>
            <button type="button" class="btn btn-outline" disabled>Clear</button>
            <button type="button" class="btn btn-outline" disabled>Back</button>
            <button type="button" class="btn btn-primary" disabled>Save</button>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
