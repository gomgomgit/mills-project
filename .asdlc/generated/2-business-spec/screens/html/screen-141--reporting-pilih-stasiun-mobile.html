<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporting — Pilih Stasiun (Mobile) | Mill Smart Log</title>
  <link rel="stylesheet" href="../../../1-foundation/uiux-spec/assets/design-tokens.css">
  <style>
    /* ---- Page-specific layout only. Warna/radius/shadow seluruhnya dari token. ---- */
    body {
      margin: 0;
      padding: var(--space-lg);
      background-color: var(--color-surface);
      font-family: var(--font-family);
      line-height: var(--line-height-base);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      overflow-x: hidden;
    }

    /* Layar ponsel (Vue 3 + Capacitor), bukan halaman web bersidebar. */
    .phone-frame {
      width: 390px;
      max-width: 100%;
      min-height: 780px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0 20px 20px;
      background-color: var(--color-background);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-modal);
      box-shadow: var(--shadow-modal);
      overflow: hidden;
    }

    /* ---- Header (pola .app-header StationListView.vue) ---- */
    .app-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--space-mobile_header_height);
      margin: 0 -20px;
      padding: 0 20px;
      background-color: var(--color-background);
    }

    .app-header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      color: var(--color-brand);
      flex-shrink: 0;
    }

    .brand-name {
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-h1);
      color: var(--color-text-primary);
    }

    .hamburger-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--space-touch_target_min);
      height: var(--space-touch_target_min);
      border: none;
      border-radius: var(--radius-button);
      background-color: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
    }

    /* ---- Breadcrumb + judul (pola .station-list-header StationListView.vue) ---- */
    .screen-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      flex-wrap: wrap;
    }

    .breadcrumb-link {
      padding: 2px 4px;
      border: none;
      border-radius: var(--radius-input);
      background-color: transparent;
      color: var(--color-text-muted);
      font-size: var(--font-size-caption);
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
    }

    .breadcrumb-link:hover { text-decoration: underline; }

    .breadcrumb-separator {
      font-size: var(--font-size-caption);
      color: var(--color-text-muted);
    }

    .breadcrumb-current {
      padding: 2px 4px;
      color: var(--color-text-muted);
      font-size: var(--font-size-caption);
      font-weight: 500;
    }

    .screen-title {
      margin: 0;
      font-size: 20px;
      font-weight: var(--font-weight-h2);
      color: var(--color-text-primary);
    }

    /* ---- Pesan info (pola .info-message HomeView.vue) ---- */
    .info-message {
      margin: 0;
      padding: 10px 12px;
      border-radius: var(--radius-button);
      background-color: var(--color-surface);
      color: var(--color-text-primary);
      font-size: 13px;
    }

    /* ---- Grid tile stasiun (pola .station-grid StationGrid.vue) ---- */
    .station-grid-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .station-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .station-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: var(--space-touch_target_min);
      padding: 22px 6px;
      box-sizing: border-box;
      border: none;
      border-radius: var(--radius-button);
      text-align: center;
      cursor: pointer;
      font-family: inherit;
    }

    .station-tile-icon { flex-shrink: 0; }

    .station-tile-name {
      font-size: 13px;
      font-weight: var(--font-weight-h2);
      line-height: 1.2;
    }

    .station-tile-hint {
      font-size: 11px;
      font-weight: var(--font-weight-body);
      line-height: 1.2;
    }

    /*
     * AKTIF — laporan mobile stasiun ini sudah dibangun.
     * Hijau merek (keluarga LAPORAN), bukan merah #D20000 milik layar input data.
     */
    .station-tile--available {
      background-color: var(--color-brand);
      color: var(--color-background);
      box-shadow: var(--shadow-card);
    }

    /*
     * NONAKTIF — laporan mobile stasiun itu BELUM DIBANGUN (bukan berarti
     * stasiunnya tidak aktif di mill). Karena itu sengaja BUKAN gaya
     * "placeholder station" abu-abu milik StationGrid.vue, melainkan gaya
     * tile aktif yang diredupkan: tetap keluarga hijau/laporan, tanpa
     * bayangan, teks & ikon dimuted, tetap terbaca.
     * Tetap dapat diketuk — aria-disabled, BUKAN atribut disabled native,
     * agar ketukan tetap memunculkan .info-message.
     */
    .station-tile--unavailable {
      background-color: var(--color-header-tint);
      color: var(--color-text-muted);
      box-shadow: none;
    }

    /* ---- Catatan aktor ---- */
    .meta-note {
      width: 390px;
      max-width: 100%;
      font-size: var(--font-size-xs);
      color: var(--color-muted-foreground);
      font-style: italic;
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>

<div class="phone-frame">

    <button type="button" class="hamburger-button" aria-label="Buka menu navigasi">

  </div>

          <rect x="2" y="7" width="20" height="10" rx="1"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><line x1="6" y1="17" x2="6" y2="20"/><line x1="18" y1="17" x2="18" y2="20"/>
