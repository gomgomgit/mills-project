<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — loading | SimpleTodo</title>
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <link rel="stylesheet" href="assets/daisyui.full.min.css">
  <script src="assets/tailwindcdn.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: 'var(--primary)',
            'primary-hover': 'var(--primary-hover)',
            'primary-content': '#ffffff',
            secondary: 'var(--surface)',
            error: 'var(--error)',
            success: 'var(--success)',
            warning: 'var(--warning)',
            'body-bg': 'var(--bg)',
            'body-text': 'var(--text-primary)',
            neutral: 'var(--text-muted)',
          },
          borderRadius: {
            button: 'var(--radius-button)',
            input: 'var(--radius-input)',
            card: 'var(--radius-card)',
            modal: 'var(--radius-modal)',
            chip: 'var(--radius-chip)',
          },
          spacing: {
            'sidebar-width': 'var(--sidebar-width)',
            'header-height': 'var(--header-height)',
            'content-padding': 'var(--content-padding)',
            'gap-sm': 'var(--gap-sm)',
            'gap-md': 'var(--gap-md)',
            'gap-lg': 'var(--gap-lg)',
          }
        }
      },
      important: true
    }
  </script>
  <style>
    /* Page-specific layout only — structural CSS, no colour/radius/shadow values */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--gap-md);
      margin-bottom: var(--gap-lg);
    }

    .task-section-title {
      font-size: var(--font-size-h3);
      font-weight: var(--font-weight-h3);
      margin-bottom: var(--gap-md);
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-card);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-card.pending .stat-icon { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
    .stat-card.done .stat-icon { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); }
    .stat-card.overdue .stat-icon { background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--warning); }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: var(--gap-sm);
    }

    .task-list-item {
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
      padding: var(--gap-sm) var(--gap-md);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: var(--bg);
      transition: box-shadow 0.15s, background-color 0.15s;
    }

    .skeleton-block {
      border-radius: var(--radius-input);
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- ==================== Sidebar ==================== -->
    <aside class="sidebar" style="background: var(--surface); border-right: 1px solid var(--border);">
      <div class="sidebar-header" style="color: var(--primary); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 2H3a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V12"/><path d="M12 2v7h7"/></svg>
        SimpleTodo
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          Dashboard
        </a>
        <a class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c5 0 9 1.6 9 4v10c0 2.4-4 4-9 4s-9-1.6-9-4V9c0-2.4 4-4 9-4Z"/><path d="M12 5V9"/><circle cx="12" cy="14" r="1.5"/><circle cx="6" cy="14" r="1.5"/><circle cx="18" cy="14" r="1.5"/></svg>
          Groups
        </a>

        <div style="margin-top: auto; padding: var(--gap-sm) 0;">
          <p style="padding: 0 var(--gap-lg); font-size: var(--font-size-caption); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; color: var(--text-muted);">Grup Task</p>

          <a class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14"/><path d="M5 12h14"/><path d="M5 19h14"/></svg>
            Pekerjaan
          </a>
          <a class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14"/><path d="M5 12h14"/><path d="M5 19h14"/></svg>
            Pribadi
          </a>
          <a class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14"/><path d="M5 12h14"/><path d="M5 19h14"/></svg>
            Belanja
          </a>
          <a class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14"/><path d="M5 12h14"/><path d="M5 19h14"/></svg>
            Kesehatan
          </a>
        </div>
      </nav>
    </aside>

    <!-- ==================== Main Content ==================== -->
    <div class="main-content">

      <!-- Topbar -->
      <div class="topbar" style="border-bottom: 1px solid var(--border);">
        <button class="btn btn-ghost btn-sm sidebar-toggle lg:hidden"
                onclick="document.getElementById('mobileSidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('visible');">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <div class="topbar-breadcrumb">
          <span>Dashboard</span>
        </div>

        <div class="topbar-end">
          <span class="text-sm" style="color: var(--text-muted);">Sabtu, 23 Juni 2026</span>
        </div>
      </div>

      <!-- Mobile sidebar overlay -->
      <div id="sidebarOverlay" class="sidebar-overlay" onclick="document.getElementById('mobileSidebar').classList.remove('open'); this.classList.remove('visible');"></div>

      <!-- Content Area -->
      <div class="content-area">

        <!-- Page Header — skeleton -->
        <div class="page-header">
          <div>
            <div class="skeleton" style="height: 1.75rem; width: 8rem; margin-bottom: var(--gap-sm);"></div>
            <div class="skeleton" style="height: 1rem; width: 14rem;"></div>
          </div>
          <div class="page-actions">
            <div class="skeleton" style="height: 2.25rem; width: 9rem;"></div>
          </div>
        </div>

        <!-- Stat Cards — skeleton -->
        <div class="dashboard-grid">
          <!-- Pending stat skeleton -->
          <div class="stat-card">
            <div style="display: flex; align-items: center; gap: var(--gap-md);">
              <div class="stat-icon skeleton"></div>
              <div style="flex: 1;">
                <div class="skeleton" style="height: 0.875rem; width: 60%; margin-bottom: var(--gap-sm);"></div>
                <div class="skeleton" style="height: 1.375rem; width: 40%;"></div>
              </div>
            </div>
          </div>

          <!-- Done stat skeleton -->
          <div class="stat-card">
            <div style="display: flex; align-items: center; gap: var(--gap-md);">
              <div class="stat-icon skeleton"></div>
              <div style="flex: 1;">
                <div class="skeleton" style="height: 0.875rem; width: 55%; margin-bottom: var(--gap-sm);"></div>
                <div class="skeleton" style="height: 1.375rem; width: 35%;"></div>
              </div>
            </div>
          </div>

          <!-- Overdue stat skeleton -->
          <div class="stat-card">
            <div style="display: flex; align-items: center; gap: var(--gap-md);">
              <div class="stat-icon skeleton"></div>
              <div style="flex: 1;">
                <div class="skeleton" style="height: 0.875rem; width: 50%; margin-bottom: var(--gap-sm);"></div>
                <div class="skeleton" style="height: 1.375rem; width: 30%;"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Task Hari Ini Section — skeleton -->
        <div>
          <div class="skeleton" style="height: 1.25rem; width: 9rem; margin-bottom: var(--gap-md);"></div>

          <div class="task-list">
            <!-- Skeleton task row 1 -->
            <div class="task-list-item">
              <div class="skeleton" style="width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;"></div>
              <div style="flex: 1;">
                <div class="skeleton" style="height: 1rem; width: 75%;"></div>
              </div>
              <div style="display: flex; gap: var(--gap-sm);">
                <div class="skeleton" style="height: 1.25rem; width: 5rem; border-radius: var(--radius-chip);"></div>
                <div class="skeleton" style="height: 1.25rem; width: 5.5rem; border-radius: var(--radius-chip);"></div>
              </div>
            </div>

            <!-- Skeleton task row 2 -->
            <div class="task-list-item">
              <div class="skeleton" style="width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;"></div>
              <div style="flex: 1;">
                <div class="skeleton" style="height: 1rem; width: 65%;"></div>
              </div>
              <div style="display: flex; gap: var(--gap-sm);">
                <div class="skeleton" style="height: 1.25rem; width: 4.5rem; border-radius: var(--radius-chip);"></div>
                <div class="skeleton" style="height: 1.25rem; width: 5rem; border-radius: var(--radius-chip);"></div>
              </div>
            </div>

            <!-- Skeleton task row 3 -->
            <div class="task-list-item">
              <div class="skeleton" style="width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;"></div>
              <div style="flex: 1;">
                <div class="skeleton" style="height: 1rem; width: 80%;"></div>
              </div>
              <div style="display: flex; gap: var(--gap-sm);">
                <div class="skeleton" style="height: 1.25rem; width: 5rem; border-radius: var(--radius-chip);"></div>
                <div class="skeleton" style="height: 1.25rem; width: 4.5rem; border-radius: var(--radius-chip);"></div>
              </div>
            </div>

            <!-- Skeleton task row 4 -->
            <div class="task-list-item">
              <div class="skeleton" style="width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;"></div>
              <div style="flex: 1;">
                <div class="skeleton" style="height: 1rem; width: 70%;"></div>
              </div>
              <div style="display: flex; gap: var(--gap-sm);">
                <div class="skeleton" style="height: 1.25rem; width: 5.5rem; border-radius: var(--radius-chip);"></div>
                <div class="skeleton" style="height: 1.25rem; width: 5rem; border-radius: var(--radius-chip);"></div>
              </div>
            </div>

            <!-- Skeleton task row 5 -->
            <div class="task-list-item">
              <div class="skeleton" style="width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;"></div>
              <div style="flex: 1;">
                <div class="skeleton" style="height: 1rem; width: 60%;"></div>
              </div>
              <div style="display: flex; gap: var(--gap-sm);">
                <div class="skeleton" style="height: 1.25rem; width: 5rem; border-radius: var(--radius-chip);"></div>
                <div class="skeleton" style="height: 1.25rem; width: 4.5rem; border-radius: var(--radius-chip);"></div>
              </div>
            </div>

            <!-- Skeleton task row 6 -->
            <div class="task-list-item">
              <div class="skeleton" style="width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;"></div>
              <div style="flex: 1;">
                <div class="skeleton" style="height: 1rem; width: 85%;"></div>
              </div>
              <div style="display: flex; gap: var(--gap-sm);">
                <div class="skeleton" style="height: 1.25rem; width: 4.5rem; border-radius: var(--radius-chip);"></div>
                <div class="skeleton" style="height: 1.25rem; width: 5rem; border-radius: var(--radius-chip);"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
