<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>list — empty | MySimpleTodo</title>
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Page-specific layout only — all color/spacing values use CSS variables from design-tokens.css */
    .content-wrapper {
      max-width: var(--space-content-max-width);
      margin: 0 auto;
      padding: 0 var(--space-page-padding) var(--space-page-padding);
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 14px 20px;
    }
  </style>
</head>
<body class="bg-base-100 min-h-screen">
  <div class="content-wrapper">

    <!-- ────────────────────────────────
         Page Header
         ──────────────────────────────── -->
    <header class="flex items-center justify-between pt-8 pb-5 border-b border-base-200">
      <h1 class="text-2xl font-bold tracking-tight text-base-content">MySimpleTodo</h1>
      <button class="btn btn-primary btn-sm gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Add Task
      </button>
    </header>

    <!-- ────────────────────────────────
         Filter & Sort Bar
         ──────────────────────────────── -->
    <div class="flex items-center gap-3 py-4">
      <span class="text-sm font-medium text-base-content/60">Filter</span>
      <select class="select select-bordered select-sm w-44 focus:outline-none">
        <option value="all" selected>All Statuses</option>
        <option value="todo">Todo</option>
        <option value="in-progress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <div class="flex-1"></div>
      <!-- Task count: 0 tasks when list is empty -->
      <span class="text-sm text-base-content/40">0 tasks</span>
      <button class="btn btn-ghost btn-sm gap-1.5 border border-base-300 bg-base-200 font-normal text-base-content/70">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 4.5h14.25M3 9h9.75M3 13.5h9.75m4.5-4.5v12m0 0l-3.75-3.75M17.25 21L21 17.25"/>
        </svg>
        Due Date
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-primary" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/>
        </svg>
      </button>
    </div>

    <!-- ────────────────────────────────
         Task List — empty state
         Centered empty-state with prompt
         to create the first task.
         ──────────────────────────────── -->
    <main class="pb-12">
      <div class="flex flex-col items-center justify-center py-24 gap-5 text-center">

        <!-- Clipboard illustration -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-14 h-14 text-base-content/20" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="1" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2
                   2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>

        <!-- Heading -->
        <div class="space-y-1">
          <p class="text-base font-semibold text-base-content/50">No tasks yet.</p>
          <p class="text-sm text-base-content/35">Add your first task to get started.</p>
        </div>

        <!-- Primary CTA -->
        <button class="btn btn-primary btn-sm gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
          Add Task
        </button>

      </div>
    </main>

  </div>
</body>
</html>
