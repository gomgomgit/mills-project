<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>list — empty | Mill Smart Log</title>
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <style>
    /* Page-specific layout only — no colour/radius/shadow literals, CSS variables only */
    body {
      background: var(--color-surface);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
    }
    .preview-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--space-md); }
    .preview-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .mobile-shell { min-height: 780px; box-shadow: var(--shadow-dropdown); }

    .mobile-header-title { display: flex; align-items: center; gap: var(--space-sm); flex: 1; min-width: 0; }
    .mobile-header-title h1 {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-lg);
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: var(--space-touch-target-min); height: var(--space-touch-target-min);
      flex-shrink: 0; color: var(--color-text-primary); cursor: pointer;
    }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .empty-state { height: 100%; min-height: 560px; }
    .empty-state-icon svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="preview-wrap">
    <div class="preview-label">List &mdash; empty state (station selector) &middot; Mobile (Operator/Supervisor)</div>

    <div class="mobile-shell">
      <!-- Header: back + title -->
      <div class="mobile-header">
        <span class="icon-btn" title="Kembali">
          <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </span>
        <div class="mobile-header-title">
          <h1>Pilih Stasiun</h1>
        </div>
        <span class="icon-btn" title="Menu">
          <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </span>
      </div>
      <div class="mobile-breadcrumb">Production Process Activity</div>

      <!-- Body: empty state — no stations configured for this mill yet -->
      <div class="mobile-content">
        <div class="empty-state">
          <span class="empty-state-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </span>
          <div class="empty-state-title">Belum ada stasiun tersedia</div>
          <div class="empty-state-desc">Data stasiun untuk mill ini belum dikonfigurasi. Hubungi Admin untuk menambahkan Weighbridge, Grading, atau Cages Track.</div>
          <button type="button" class="btn btn-outline">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Muat Ulang
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
