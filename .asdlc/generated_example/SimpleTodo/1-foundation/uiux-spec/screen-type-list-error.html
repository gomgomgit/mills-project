<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>list — error | MySimpleTodo</title>
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Page-specific layout only — all color/spacing values use CSS variables from design-tokens.css */
    .content-wrapper {
      max-width: var(--space-content-max-width);
      margin: 0 auto;
      padding: 0 var(--space-page-padding) var(--space-page-padding);
    }
    .task-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 14px 20px;
    }
  </style>
</head>
<body class="bg-base-100 min-h-screen">
  <div class="content-wrapper">

    <!-- ────────────────────────────────
         Page Header
         ──────────────────────────────── -->
    <header class="flex items-center justify-between pt-8 pb-5 border-b border-base-200">
      <h1 class="text-2xl font-bold tracking-tight text-base-content">MySimpleTodo</h1>
      <button class="btn btn-primary btn-sm gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Add Task
      </button>
    </header>

    <!-- ────────────────────────────────
         Filter & Sort Bar
         ──────────────────────────────── -->
    <div class="flex items-center gap-3 py-4">
      <span class="text-sm font-medium text-base-content/60">Filter</span>
      <select class="select select-bordered select-sm w-44 focus:outline-none" disabled>
        <option value="all" selected>All Statuses</option>
        <option value="todo">Todo</option>
        <option value="in-progress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <div class="flex-1"></div>
      <!-- Task count: indeterminate on error -->
      <span class="text-sm text-base-content/30">&mdash;</span>
      <button class="btn btn-ghost btn-sm gap-1.5 border border-base-300 bg-base-200 font-normal text-base-content/40" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 4.5h14.25M3 9h9.75M3 13.5h9.75m4.5-4.5v12m0 0l-3.75-3.75M17.25 21L21 17.25"/>
        </svg>
        Due Date
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-primary/40" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/>
        </svg>
      </button>
    </div>

    <!-- ────────────────────────────────
         Task List — error state
         DaisyUI alert-error banner at the
         top of the list area with a retry
         button. No task rows are rendered.
         ──────────────────────────────── -->
    <main class="pb-12">

      <!-- Error alert banner -->
      <div role="alert" class="alert alert-error shadow-sm">
        <!-- Error icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874
                   1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
        </svg>

        <!-- Message -->
        <div class="flex-1">
          <p class="font-semibold text-sm">Failed to load tasks</p>
          <p class="text-sm opacity-80">Unable to reach the server. Check your connection and try again.</p>
        </div>

        <!-- Retry button -->
        <button class="btn btn-sm btn-ghost border border-current/30 gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993
                     0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0
                     0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
          </svg>
          Retry
        </button>
      </div>

    </main>

  </div>
</body>
</html>
