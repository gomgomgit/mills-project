<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Web | Mill Smart Log</title>
  <link rel="stylesheet" href="../../../1-foundation/uiux-spec/assets/design-tokens.css">
  <link rel="stylesheet" href="../../../1-foundation/uiux-spec/assets/components.css">
  <link rel="stylesheet" href="../../../1-foundation/uiux-spec/assets/shell.css">
  <style>
    /* page-specific layout only — no colour values, no radius/shadow, use CSS variables only */
    body {
      margin: 0;
      background: var(--color-background);
    }
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl, 4rem) var(--space-md, 1rem);
      box-sizing: border-box;
    }
    .login-wrapper {
      width: 100%;
      max-width: 400px;
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm, 0.5rem);
      margin-bottom: var(--space-xl, 2rem);
    }
    .login-brand-mark {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-card, 12px);
      background: var(--color-brand);
      color: var(--color-background);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
    }
    .login-brand-name {
      font-size: var(--font-size-h3, 18px);
      font-weight: 600;
      color: var(--color-text-primary);
    }
    .login-brand-sub {
      font-size: var(--font-size-small, 14px);
      color: var(--color-text-muted);
    }
    .login-footnote {
      text-align: center;
      font-size: var(--font-size-xs, 12px);
      color: var(--color-text-muted);
      font-style: italic;
      margin-top: var(--space-lg, 1.5rem);
    }
    .login-form-footer {
      display: flex;
      justify-content: center;
      margin-top: var(--space-md, 1rem);
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-wrapper">
      <div class="login-brand">
        <div class="login-brand-mark">MSL</div>
        <div class="login-brand-name">Mill Smart Log</div>
        <div class="login-brand-sub">Portal Web — Admin / Supervisor / Mill Management</div>
      </div>

      <div class="card">
        <div class="card-header">Masuk ke Akun Anda</div>
        <div class="card-body">
          <form class="form">
            <div class="input-group">
              <label for="username" class="form-label">Username / NIK</label>
              <input type="text" id="username" name="username" class="form-input" value="AD-0231" placeholder="Masukkan username atau NIK">
            </div>

            <div class="input-group">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" name="password" class="form-input" value="********" placeholder="Masukkan password">
            </div>

            <div class="input-group">
              <label for="business-area" class="form-label">Business Area / Company</label>
              <select id="business-area" name="business_area" class="form-input">
                <option value="bu-kalimantan-1">PT Mill Nusantara — Business Unit Kalimantan 1</option>
                <option value="bu-kalimantan-2">PT Mill Nusantara — Business Unit Kalimantan 2</option>
                <option value="bu-sumatera-1">PT Mill Nusantara — Business Unit Sumatera 1</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-primary">Masuk</button>
            </div>
          </form>

          <div class="login-form-footer">
            <a href="#" class="btn-ghost-link">Lupa Password?</a>
          </div>
        </div>
      </div>

      <p style="font-size:var(--font-size-xs, 12px);color:var(--color-text-muted);font-style:italic;margin-top:var(--space-lg, 1.5rem);text-align:center">
        Actors: Admin &nbsp;·&nbsp; Supervisor &nbsp;·&nbsp; Mill Management &nbsp;·&nbsp;
        Entry points: Mengakses URL aplikasi web saat belum login, Redirect otomatis setelah sesi login berakhir/expired, Redirect setelah logout
      </p>
    </div>
  </div>
</body>
</html>
